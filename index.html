```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Game Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    #menu {
      height: 50px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    #game-select {
      background: #303030;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 8px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    #game-area {
      height: calc(100% - 50px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }
  </style>
</head>

<body>

  <div id="menu">
    <label for="game-select">Choose a game:</label>

    <select id="game-select">
      <option value="">Select a game</option>
      <option value="games/game1/index.html">Game 1</option>
      <option value="games/game2/index.html">Game 2</option>
      <option value="games/game3/index.html">Game 3</option>
    </select>
  </div>

  <div id="game-area">
    <iframe
      id="game-frame"
      allow="autoplay; fullscreen"
      allowfullscreen
      title="Game window"
      style="display: none;">
    </iframe>
  </div>

  <script>
    const gameSelect = document.getElementById("game-select");
    const gameFrame = document.getElementById("game-frame");

    gameSelect.addEventListener("change", function () {
      const game = this.value;

      if (!game) {
        gameFrame.style.display = "none";
        gameFrame.src = "about:blank";
        return;
      }

      gameFrame.src = game;
      gameFrame.style.display = "block";
    });
  </script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    #menu {
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    #game-select {
      background: #303030;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 8px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    #game-area {
      width: 100%;
      height: calc(100% - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }
    
    #status-message {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10000;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status-message">Games do not currentely work on chromebooks</div>
  <div id="menu">
    <label for="game-select">Games:</label>

    <select id="game-select">
      <option value="Select">Select a Game</option>
      <option value="games/templeOfBoom/index.html">Temple of Boom</option>
      <option value="games/rooftopSnipers/index.html">Rooftop Snipers 2</option>
      <option value="games/subway surfers/index.html">Subway Surfers</option>
      <option value="games/paperIo/index.html">Paper.io</option>
      <option value="games/BTTS/index.html">Big Tower Tiny Square</option>
    </select>
  </div>

  <div id="game-area">
    <iframe
      id="game-frame"
      allow="autoplay; fullscreen"
      allowfullscreen
      style="display: none;">
    </iframe>
  </div>

  <script>
    const gameSelect = document.getElementById("game-select");
    const gameFrame = document.getElementById("game-frame");

    gameSelect.addEventListener("change", function () {
      const game = this.value;

      if (!game) {
        gameFrame.style.display = "none";
        gameFrame.src = "about:blank";
        return;
      }

      gameFrame.src = game;
      gameFrame.style.display = "block";
    });
  </script>

</body>
</html>

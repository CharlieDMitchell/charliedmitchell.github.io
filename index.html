<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>really cool flash game</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      scale: "showAll",
      forceScale: false,
      quality: "low",
      letterbox: "on",
      backgroundColor: "#000000"
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>

<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("game-container");
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      const aspectRatio = 4 / 3;

      function resizeGame() {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        let width = screenHeight * aspectRatio;
        let height = screenHeight;

        if (width > screenWidth) {
          width = screenWidth;
          height = screenWidth / aspectRatio;
        }

        player.style.width = `${Math.floor(width)}px`;
        player.style.height = `${Math.floor(height)}px`;
      }

      container.appendChild(player);
      resizeGame();

      window.addEventListener("resize", resizeGame);

      player.load(
        "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@main/temple-of-boom.swf"
      );
    });
  </script>
</body>
</html>

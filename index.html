
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>really cool flash game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      overflow: hidden;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      scale: "showAll",
      forceScale: true,
      letterbox: "on",
      backgroundColor: "#000000",
      allowFullscreen: true
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>

<body>
  <div id="game-container"></div>

  <script>
    const container = document.getElementById("game-container");

    function resizeGame() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const aspectRatio = 4 / 3;

      let width = screenHeight * aspectRatio;
      let height = screenHeight;

      if (width > screenWidth) {
        width = screenWidth;
        height = screenWidth / aspectRatio;
      }

      container.style.width = `${screenWidth}px`;
      container.style.height = `${screenHeight}px`;

      const player = container.querySelector("ruffle-player");

      if (player) {
        player.style.width = `${Math.floor(width)}px`;
        player.style.height = `${Math.floor(height)}px`;
      }
    }

    window.addEventListener("resize", resizeGame);

    window.addEventListener("DOMContentLoaded", async () => {
      resizeGame();

      const ruffle = window.RufflePlayer?.newest();

      if (!ruffle) {
        container.textContent = "Ruffle failed to load.";
        return;
      }

      const player = ruffle.createPlayer();

      player.style.width = "100%";
      player.style.height = "100%";

      container.appendChild(player);

      resizeGame();

      try {
        await player.ruffle().load({
          url: "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@main/temple-of-boom.swf",
          autoplay: "on",
          scale: "showAll",
          forceScale: true,
          letterbox: "on",
          backgroundColor: "#000000"
        });
      } catch (error) {
        console.error("Failed to load game:", error);
        container.textContent = "Failed to load the game.";
      }
    });
  </script>
</body>
</html>

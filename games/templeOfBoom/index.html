<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temple of Boom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #flash-container {
      position: fixed;
      width: min(100vw, 133.333vh);
      height: min(75vw, 100vh);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
    }

    ruffle-player {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>

<body>
  <div id="flash-container"></div>

  <script>
    window.addEventListener("load", async () => {
      const container = document.getElementById("flash-container");
      const ruffle = window.RufflePlayer?.newest();

      if (!ruffle) {
        container.textContent = "Ruffle failed to load.";
        return;
      }

      const player = ruffle.createPlayer();

      player.style.width = "100%";
      player.style.height = "100%";

      container.appendChild(player);

      await player.load(
        "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@main/temple-of-boom.swf"
      );
    });
  </script>
</body>
</html>
